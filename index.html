<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Tell the browser our actual colors so its own surfaces (canvas,
       status/gesture areas) match instead of guessing a darker black. -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)">
  <title>The Alignment Index</title>
  <meta name="description" content="A plain-language index of AI alignment topics and misalignment incidents. Coming soon.">
  <meta property="og:title" content="The Alignment Index">
  <meta property="og:description" content="A plain-language index of AI alignment topics and misalignment incidents. Coming soon.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://thealignmentindex.org/">
  <link rel="canonical" href="https://thealignmentindex.org/">
  <!-- PNG first, SVG after: SVG-capable browsers prefer it (and get the
       dark-mode variant); Safari falls back to the PNG. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- TODO: og:image once a share card exists. -->
  <style>
    /* The site's neutral ramp (globals.css); dark is the same remap. */
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --n300: #d4d4d4;
      --n400: #a3a3a3;
      --n600: #525252;
      /* The join/input/confirmation line share one type size, and the
         width-measuring mirror must match it exactly. */
      --line-size: 20px;
      /* Optical re-center while the arrow is present: the form shifts
         left by this, and the note compensates right by the same. */
      --shift: 8px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f0f;
        --n300: #404040;
        --n400: #8a8a8a;
        --n600: #c7c7c7;
      }
    }

    /* No scrolling or rubber-band overscroll — the page is one fixed
       viewport (same overscroll rule as the prototype). */
    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      /* The root paints the same ground as the body, so no canvas or
         overscroll region can show a different grey. */
      background: var(--bg);
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--n600);
      /* No grey tap flash on touch — state changes are the feedback. */
      -webkit-tap-highlight-color: transparent;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Page state machine (body[data-state]): exactly one of the three
       lines under the wordmark shows — rest | edit | joined. */
    body:not([data-state="rest"]) .join,
    body:not([data-state="edit"]) .newsletter-form,
    body:not([data-state="joined"]) .confirmation {
      display: none;
    }

    .wordmark {
      font-size: 24px; /* text-2xl */
      font-weight: 500;
      color: var(--n600);
      margin: 0 0 16px;
    }

    /* Rest state: a bare text line, the sidebar menu-item treatment. */
    .join {
      border: 0;
      background: none;
      padding: 0;
      font: inherit;
      font-size: var(--line-size);
      color: var(--n400);
      cursor: pointer;
      transition: color 150ms ease;
      /* Touch: a tap or long-press must never text-select the label. */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    /* Hover states only where hover really exists — touch browsers
       latch :hover onto the last-tapped element and it sticks. */
    @media (hover: hover) {
      .join:hover { color: var(--n600); }
      .newsletter-submit:hover { color: var(--n600); }
    }

    /* Edit state: the line becomes a boxless input; the arrow hangs
       off the end of the text, so only the input takes part in the
       page's centering. When the arrow is present, the text re-centers
       optically, not mathematically: full compensation would be 14px
       ((20px arrow + 8px gap) / 2), but the arrow is the lightest mass
       on the page and hangs like terminal punctuation, so the text
       yields only --shift and keeps its own mass near true center.
       Animated both directions. */
    .newsletter-form {
      position: relative;
      transition: transform 300ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .newsletter-form.ready {
      transform: translateX(calc(-1 * var(--shift)));
    }
    .newsletter-input {
      border: 0;
      background: none;
      outline: none;
      /* 1px each side keeps Safari's subpixel glyph edges clear of the
         clip boundary (stray half-pixel slivers otherwise). */
      padding: 0 1px;
      font: inherit;
      font-size: var(--line-size);
      color: var(--n400);
      max-width: calc(100vw - 96px);
    }
    .newsletter-input::placeholder { color: var(--n300); }
    /* Defeat the browser's autofill tint: paint the page color back over
       it and keep the text in the input's grey. */
    .newsletter-input:-webkit-autofill,
    .newsletter-input:-webkit-autofill:hover,
    .newsletter-input:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0 1000px var(--bg) inset;
      -webkit-text-fill-color: var(--n400);
      transition: background-color 9999s ease-out;
    }
    .newsletter-input:autofill {
      box-shadow: 0 0 0 1000px var(--bg) inset;
    }

    /* Submit arrow: floats a few spaces past the last character (the
       input is sized to its text, and the arrow rides its right edge),
       surfacing only once the address is complete — its presence IS the
       validation signal. */
    .newsletter-submit {
      position: absolute;
      left: calc(100% + 8px);
      top: 50%;
      transform: translate(-6px, -50%);
      display: flex;
      border: 0;
      background: none;
      padding: 0;
      color: var(--n400);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      /* Enter and exit both animate: fade with the slide, on the same
         curve as the form's re-center shift. */
      transition:
        opacity 300ms ease,
        transform 300ms cubic-bezier(0.22, 1, 0.36, 1),
        color 150ms ease;
    }
    .newsletter-form.ready .newsletter-submit {
      opacity: 1;
      transform: translate(0, -50%);
      pointer-events: auto;
    }
    .newsletter-submit svg { display: block; }
    /* In flight, the arrow becomes the spinner in place. */
    .newsletter-submit .spinner { display: none; }
    .newsletter-form.sending .arrow-icon { display: none; }
    .newsletter-form.sending .spinner {
      display: block;
      /* Slow enough that the stroke holds its apparent weight — fast
         rotation smears it thin. */
      animation: spin 1400ms linear infinite;
    }
    .newsletter-form.sending .newsletter-submit { pointer-events: none; }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Terminal state: the whole line yields to the confirmation, set in
       the input's own type. */
    .confirmation {
      font-size: var(--line-size);
      color: var(--n400);
      margin: 0;
    }

    /* Messages sit below the input line, absolutely positioned so their
       arrival never shifts the centered composition. The note stays
       page-centered: the form is shifted --shift left while .ready, so
       the note compensates the other way, riding the same curve. */
    .form-note {
      position: absolute;
      top: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      margin: 0;
      font-size: 14px;
      color: var(--n400);
      white-space: nowrap;
      transition: left 300ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .newsletter-form.ready .form-note {
      left: calc(50% + var(--shift));
    }

    @media (prefers-reduced-motion: reduce) {
      .newsletter-form { transition: none; }
      .form-note { transition: none; }
      .newsletter-submit {
        transition: opacity 300ms ease, color 150ms ease;
      }
    }

    /* Hidden mirror for measuring the text width the input should take. */
    .measure {
      position: absolute;
      visibility: hidden;
      white-space: pre;
      font-size: var(--line-size);
    }
  </style>
</head>
<body data-state="rest">
  <h1 class="wordmark">The Alignment Index</h1>

  <button type="button" class="join" id="join-button">Get updates</button>
  <form class="newsletter-form" id="newsletter-form" autocomplete="off" novalidate>
    <input
      class="newsletter-input"
      id="newsletter-input"
      type="email"
      name="nl"
      maxlength="254"
      placeholder="Email address"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      aria-label="Email address"
    >
    <button type="submit" class="newsletter-submit" aria-label="Submit email">
      <svg class="arrow-icon" width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2.5 8h11"/>
        <path d="M9 3.5 13.5 8 9 12.5"/>
      </svg>
      <!-- While the request is in flight the arrow becomes a spinner:
           the same stroke weight, a three-quarter arc. -->
      <svg class="spinner" width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
        <path d="M8 1.5 A 6.5 6.5 0 1 1 1.5 8"/>
      </svg>
    </button>
    <p class="form-note" id="form-note" aria-live="polite"></p>
  </form>
  <!-- Filled and shown on success; role="status" announces it to
       screen readers (the visual note region is emptied then). -->
  <p class="confirmation" id="confirmation" role="status"></p>
  <span class="measure" id="measure" aria-hidden="true"></span>

  <script>
    // "Get updates" becomes a bare input in place; Escape (or leaving
    // the empty field) restores it. The input is continually sized to
    // its content so the arrow floats just past the last character.
    // Which line shows is one state attribute on <body> — rest | edit |
    // joined — with the CSS state rules deciding visibility.
    const join = document.getElementById("join-button");
    const form = document.getElementById("newsletter-form");
    const input = document.getElementById("newsletter-input");
    const measure = document.getElementById("measure");
    const note = document.getElementById("form-note");
    const confirmation = document.getElementById("confirmation");

    const setState = (state) => {
      document.body.dataset.state = state;
    };

    const size = () => {
      measure.textContent = input.value || input.placeholder;
      // Subpixel-accurate width (offsetWidth truncates, which lets
      // Safari clip glyph edges), rounded up plus room for the caret.
      const width = measure.getBoundingClientRect().width;
      input.style.width = Math.ceil(width) + 2 + "px";
    };

    join.addEventListener("click", () => {
      setState("edit");
      size();
      input.focus();
    });

    const restore = () => {
      setState("rest");
      note.textContent = "";
    };
    // Only characters that can appear in an address (the HTML email
    // spec's set) ever land in the field — spaces and everything else
    // are dropped at the door, typed or pasted.
    const sanitize = (text) =>
      text.replace(/[^A-Za-z0-9.!#$%&'*+/=?^_`{|}~@-]/g, "");

    // The server's validity test, mirrored: the arrow only appears for
    // addresses the endpoint will actually accept.
    const VALID = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    const update = () => {
      size();
      form.classList.toggle("ready", VALID.test(input.value.trim()));
      // Typing clears any error; the one live alert is the length cap.
      note.textContent =
        input.value.length >= 254
          ? "(email addresses max out at 254 characters)"
          : "";
    };

    input.addEventListener("beforeinput", (event) => {
      if (!event.data) return;
      const clean = sanitize(event.data);
      if (clean === event.data) return;
      event.preventDefault(); // blocks the keystroke outright
      // Keep the valid remainder only for real pastes. Other mixed
      // insertions are OS substitutions — e.g. double-space arriving as
      // ". " — and must be dropped whole, not salvaged into a period.
      if (clean && event.inputType === "insertFromPaste") {
        input.value = sanitize(input.value + clean);
        update();
      }
    });
    input.addEventListener("input", () => {
      // Safety net for routes beforeinput misses (drag-drop, autofill).
      const clean = sanitize(input.value);
      if (clean !== input.value) input.value = clean;
      update();
    });
    input.addEventListener("keydown", (event) => {
      if (event.key === "Escape") restore();
    });
    input.addEventListener("blur", () => {
      if (!input.value) restore();
    });
    // Belt and braces alongside novalidate: even if something triggers
    // reportValidity(), no native bubble ever surfaces.
    input.addEventListener("invalid", (event) => event.preventDefault());

    // novalidate on the form suppresses the browser's bubbles; these
    // notes take their place.
    // The waitlist endpoint: an Apps Script web app that appends to a
    // private Google Sheet. URLSearchParams keeps the POST a CORS
    // "simple request" (no preflight), and the script's JSON response
    // is readable, so the notes reflect what actually happened.
    const ENDPOINT =
      "https://script.google.com/macros/s/AKfycbyahi2CYYr-EClIJbQWX4OSE6ZQ0eBbm0w9ApZ_ovA0_VMF17ZsJ6_VjOyLyVYO_uTUPA/exec";
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (form.classList.contains("sending")) return;
      const email = input.value.trim();
      if (!email) {
        note.textContent = "(enter your email address)";
        input.focus();
        return;
      }
      // Same VALID test as the arrow and the server — one validator
      // everywhere; the server's "invalid" reply below is pure defense.
      if (!VALID.test(email)) {
        note.textContent = "(enter a valid email address)";
        input.focus();
        return;
      }
      form.classList.add("sending");
      fetch(ENDPOINT, {
        method: "POST",
        body: new URLSearchParams({ email }),
      })
        .then((response) => response.json())
        .then((result) => {
          if (result.ok) {
            // Terminal state: the line becomes the confirmation. State
            // first, then text — inserting into the visible status
            // region is what makes screen readers announce it.
            note.textContent = "";
            setState("joined");
            confirmation.textContent = "You’re on the list";
          } else if (result.error === "invalid") {
            note.textContent = "(enter a valid email address)";
          } else {
            note.textContent = "(something went wrong, try again)";
          }
        })
        .catch(() => {
          note.textContent = "(something went wrong, try again)";
        })
        .finally(() => {
          form.classList.remove("sending");
        });
    });
  </script>
</body>
</html>
